services:
  youtube-live-loop:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - app-data:/data
    environment:
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-secret-key-123}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      DATA_DIR: /data
    restart: unless-stopped

volumes:
  app-data:
